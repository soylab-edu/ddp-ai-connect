<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C / 양방향 타입 웨이브 모듈</title><script src="assets/gsap.min.js"></script><link rel="stylesheet" href="wave.css"><style>@font-face{font-family:Pretendard;src:url('assets/IBMKR-SemiBold.woff2');font-weight:800;font-display:block}*{box-sizing:border-box}html,body{margin:0;background:#111;color:white;font-family:Pretendard,Arial,sans-serif}#root{position:relative;width:1440px;height:900px;overflow:hidden}#wave-host{position:absolute;inset:0}.review-caption{position:absolute;top:32px;left:40px;right:40px;display:flex;justify-content:space-between;font-size:15px;font-weight:800;letter-spacing:.02em;z-index:10}.placeholder{position:absolute;top:170px;left:50%;width:80%;transform:translateX(-50%);text-align:center;opacity:0;font-size:74px;line-height:1.1;font-weight:800;letter-spacing:-.055em}.placeholder small{display:block;font-size:24px;margin-top:28px;letter-spacing:0}</style></head><body><div id="root" data-start="0" data-duration="16" data-width="1440" data-height="900"><div class="review-caption"><span>C / TYPOGRAPHIC CONVERGENCE</span><span>MODULE PREVIEW</span></div><div id="wave-host"></div><div class="placeholder">사람과 사람이<br>만나다.<small>최종 정보 포스터를 위한 중앙 여백</small></div></div><script src="wave.js"></script><script>const host=document.getElementById('wave-host');CWave.mount(host);CWave.resize(1440,900);const playhead={t:0};const tl=gsap.timeline({paused:true,onUpdate:()=>CWave.seek(playhead.t)});tl.to(playhead,{t:16,duration:16,ease:'none'},0);tl.to('.placeholder',{opacity:1,duration:.5},13.65);window.__timelines=window.__timelines||{};window.__timelines['c-wave-demo']=tl;document.fonts.ready.then(()=>tl.play(10.6));</script></body></html>
